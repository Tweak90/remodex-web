# Browser deployment added by the Tweak90 self-hosted fork.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: remodex-web:local
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-7878}:3000"
    environment:
      PORT: "3000"
      CODEX_WEB_PASSWORD: ${CODEX_WEB_PASSWORD:?Set CODEX_WEB_PASSWORD in the private stack environment}
      CODEX_WS_URL: ${CODEX_WS_URL:?Set CODEX_WS_URL to the existing Codex gateway}
      CODEX_API_TOKEN: ${CODEX_API_TOKEN:?Set CODEX_API_TOKEN in the private stack environment}
      HOST_LABEL: ${HOST_LABEL:-Codex}
      CODEX_PROJECTS: ${CODEX_PROJECTS:-[]}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "false"
